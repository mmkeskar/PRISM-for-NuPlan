# PRISM DPMORL-only experiment config.
#
# Isolates the personalization/reward side of PRISM from the safety/CVaR
# side entirely: beta=0 drops the cost advantage out of the combined PPO
# objective (A_total = A_reward - 0*A_cost = A_reward), and cf_coef=0
# zeroes the cost critic's own gradient too, so it doesn't even consume
# shared grad-clip budget. No other code path changes -- the cost critic
# and safety cost computation still run (harmless, just inert), so this is
# the SAME v2 architecture with the safety term switched off, not a
# different code path.
#
# Purpose: instability-analysis so far has only diagnosed the cost/safety
# side (see CHANGES.md, branch instability-analysis). This checks whether
# the OTHER half of the system -- DPMORL producing K distinguishable
# driving styles via the utility-function/z_t machinery -- works cleanly on
# its own. If it does (stable training, K policies' mean z_T logged per
# update diverge in the expected direction), that further narrows the
# instability to the beta/cost-critic interaction specifically. If it
# doesn't, that's a more fundamental problem, unrelated to CVaR/safety.
#
# Success is judged from the new z_comfort/z_progress/z_lateral/z_spacing
# fields in policy_{k}_metrics.jsonl (mean z_T per style dimension, per
# update) -- compare the K policies' trends against each other; each should
# trend higher on ITS OWN preferred dimension than the others do.
#
# K reduced 4 -> 2 for this run (less training before getting a first
# signal): policy 0 = comfort-preferring, policy 1 = progress-preferring
# (from scripts/train.py's _get_preference_vectors() generic fallback for
# n_policies != 5, which for K=2 lands on dims 0/1 -- two clearly
# contrasting, behaviorally distinct styles). If these two diverge cleanly,
# scale back up to K=4 (n_policies: 4 here, no other change needed) for
# full coverage before the warm-start/safety-combination step.
#
# Also includes the log_std clamp fix (prism/models/common/action_heads.py)
# from the previous run's real finding: entropy climbed monotonically for
# 1600+ updates with flat reward, traced to log_std having no upper bound.
#
# ent_coef reduced 0.01 -> 0.0 (see stage2 block below) after a follow-up
# run with the clamp in place STILL showed entropy climbing almost every
# bin for 2300+ updates, approaching the clamp ceiling rather than
# plateauing -- the clamp bounded the damage but didn't address why it
# keeps climbing. See CHANGES.md.

# ── Experiment ───────────────────────────────────────────────────────────────
experiment_name: prism_dpmorl_only_001
seed: 42

# ── nuPlan data ──────────────────────────────────────────────────────────────
nuplan_data_root: /data/nuplan/dataset
nuplan_map_root: /data/nuplan/maps
cache_path: /data/prism_cache
log_names: []

# ── PRISM MORL ───────────────────────────────────────────────────────────────
n_policies: 2
reward_dim: 4
gamma: 0.99

stage1:
  mode: preferences
  n_iters: 2000
  lr: 1.0e-3
  diversity_weight: 1.0

stage2:
  # 10000 -> 5000: at ~7.25s/update this run was heading for ~20h; the
  # utility-function-fix run already shows a clear, stable pattern by
  # update 1200 (entropy decreasing, reward plateaued, outcomes still
  # improving), so 5000 gives ample margin without doubling wall-clock for
  # little expected new signal. No cost/safety machinery is active in this
  # config (beta=0), so this doesn't carry the same late-onset-surprise
  # risk the safety-cost run showed (its dip-then-rise was specific to the
  # cost critic's dynamics, not present here).
  n_updates: 5000
  steps_per_update: 512
  update_epochs: 4
  minibatch_size: 64
  clip_coef: 0.2
  vf_coef: 0.5
  # 0.01 -> 0.0. Real run data: entropy climbed almost every single bin for
  # 2300+ updates, approaching the log_std clamp ceiling (~4.84) rather than
  # plateauing on its own -- the entropy bonus's constant pull toward higher
  # entropy appears effectively unopposed (ppo_loss's gradient contribution
  # to log_std is structurally weak, per-minibatch advantage normalization),
  # while reward stayed flat despite the critic and episode-outcome metrics
  # both genuinely improving. Zero (not just a smaller value) chosen
  # deliberately as the cleanest test of that exact hypothesis, and matches
  # common practice for continuous-action PPO (several well-known
  # implementations default entropy coefficient to 0.0 for continuous
  # control, relying on the Gaussian's own sampling noise for exploration).
  # See CHANGES.md.
  ent_coef: 0.0
  max_grad_norm: 0.5
  gae_lambda: 0.95
  learning_rate: 3.0e-4
  save_every: 500

# ── Safety term switched off (the only substantive change vs.
#    prism_default.yaml) ───────────────────────────────────────────────────────
beta: 0.0
cf_coef: 0.0
tau: 20.0
cvar_buffer_size: 500

alpha_start: 0.20
alpha_end: 0.95
n_curriculum_iters: 5000

gpu_log_interval_s: 20.0

# ── Observation / action space ───────────────────────────────────────────────
bev_semantics_channels: 15
bev_semantics_height: 192
bev_semantics_width: 192
obs_num_measurements: 10
num_value_measurements: 4
action_space_dim: 2

# ── CaRL simulation config ───────────────────────────────────────────────────
simulation:
  controller_type: one_stage
  proposal_sampling:
    num_poses: 40
    interval_length: 0.1
  max_episode_steps: 150

scenario_types: null
log_splits:
  - train

# ── Hardware ─────────────────────────────────────────────────────────────────
cuda: true
device: cuda:0
num_envs: 1

# ── Logging ──────────────────────────────────────────────────────────────────
output_dir: runs/
track: false
wandb_project: prism
wandb_entity: null

# ── Evaluation ───────────────────────────────────────────────────────────────
eval_scenarios: val14
n_eval_episodes: 200
