# PRISM instability-analysis experiment config.
#
# Identical to prism_default.yaml except for the 4 ablation toggles below,
# agreed on branch `instability-analysis` (see CHANGES.md for the full
# reasoning). Isolates whether training instability (cost_critic_loss
# exploding into the tens of thousands, var_nu growing 30x and never
# recovering across an 8800-update baseline run) traces to the cost
# formulation (single-timestep outcome-cost spikes, gamma^{-t} amplified)
# and/or the nu-moving-target mechanism (curriculum-driven VaR movement).
#
# The 4 changes, each independently toggleable (see the toggles section
# below -- flip any subset for future experiments without code changes):
#   1. outcome_costs_enabled: false
#        Drop Tier-1 outcome events (collision/off-road/red-light/wrong-
#        direction -- single-timestep lumps of 65-100, occasionally
#        stacking past 200) from c_t entirely. Flags still logged.
#   2. cost_scale: 0.5
#        Halve the remaining (indicator-only) per-step cost signal, to
#        bring its magnitude closer to reward's bounded (0,1]-ish per-step
#        scale without eliminating the safety signal.
#   3. active_indicators: [ttc]
#        Reduce Tier-2 indicators to TTC alone -- removes multi-indicator
#        stacking in a single frame, and gives a clean, defensible
#        "K styles, one safety rule" fallback result if time runs out.
#   4. fixed_alpha: 0.5
#        Bypass the alpha curriculum (which was climbing 0.20->0.95 over
#        5000 iterations, continuously moving nu) and use a single
#        constant alpha for the whole run -- isolates the curriculum-
#        driven component of nu's movement. Note: alpha=0.5 is a
#        debug-only choice (median, low quantile-estimation variance);
#        the final model still needs CVaR's tail focus (high alpha).
#
# Everything else below is unchanged from prism_default.yaml.

# ── Experiment ───────────────────────────────────────────────────────────────
experiment_name: prism_instability_ttc_001
seed: 42

# ── nuPlan data ──────────────────────────────────────────────────────────────
nuplan_data_root: /data/nuplan/dataset
nuplan_map_root: /data/nuplan/maps
cache_path: /data/prism_cache
log_names: []

# ── PRISM MORL ───────────────────────────────────────────────────────────────
n_policies: 5
reward_dim: 4
gamma: 0.99

stage1:
  mode: preferences
  n_iters: 2000
  lr: 1.0e-3
  diversity_weight: 1.0

stage2:
  n_updates: 10000
  steps_per_update: 512
  update_epochs: 4
  minibatch_size: 64
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  gae_lambda: 0.95
  learning_rate: 3.0e-4
  save_every: 500

# CVaR safety penalty -- beta/tau/cf_coef unchanged from prism_default.yaml.
# Only the cost FORMULATION and alpha SCHEDULE change (via the toggles
# below), not the combined-advantage machinery itself.
beta: 1.0
tau: 20.0
cf_coef: 0.5
cvar_buffer_size: 500

# ── Instability-analysis ablation toggles (the only substantive changes
#    vs. prism_default.yaml -- see header comment above) ──────────────────────
outcome_costs_enabled: false
cost_scale: 0.5
active_indicators: [ttc]
fixed_alpha: 0.5

# alpha_start/alpha_end/n_curriculum_iters are ignored while fixed_alpha is
# set (kept here for the record / easy revert to curriculum behavior).
alpha_start: 0.20
alpha_end: 0.95
n_curriculum_iters: 5000

# GPU utilization sampling interval for prism/utils/gpu_monitor.py
gpu_log_interval_s: 2.0

# ── Observation / action space ───────────────────────────────────────────────
bev_semantics_channels: 15
bev_semantics_height: 192
bev_semantics_width: 192
obs_num_measurements: 10
num_value_measurements: 4
action_space_dim: 2

# ── CaRL simulation config ───────────────────────────────────────────────────
simulation:
  controller_type: one_stage
  proposal_sampling:
    num_poses: 40
    interval_length: 0.1
  max_episode_steps: 150

scenario_types: null
log_splits:
  - train

# ── Hardware ─────────────────────────────────────────────────────────────────
cuda: true
device: cuda:0
num_envs: 1

# ── Logging ──────────────────────────────────────────────────────────────────
output_dir: runs/
track: false
wandb_project: prism
wandb_entity: null

# ── Evaluation ───────────────────────────────────────────────────────────────
eval_scenarios: val14
n_eval_episodes: 200
