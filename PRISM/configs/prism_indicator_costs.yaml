# PRISM indicator-costs experiment config.
#
# Resumes the original instability-analysis investigation (see
# prism_instability_experiment.yaml and CHANGES.md 2026-08-25 entry): a
# prior run showed cost_critic_loss exploding into the tens of thousands
# and var_nu growing 30x without recovering, over an 8800-update baseline.
# That investigation was paused (not resolved) to isolate whether the
# instability traced to the cost/safety side specifically or the style-
# reward side -- the entire DPMORL-only phase of this branch (see the many
# preceding CHANGES.md entries) was that isolation test. This config picks
# the cost-side investigation back up, now with:
#   - all the style-reward-side fixes from the DPMORL-only phase (r_progress
#     simplification, r_lane revert, ent_coef decay, UtilityFunction output
#     self-normalisation + output_scale, corrected K=2 preference-vector
#     concentration) -- these are unconditional code fixes, not config
#     flags, so they apply here automatically.
#   - much better diagnostics than the original investigation had
#     (git_commit logging, current_ent_coef, --log_reward_components,
#     analyze_metrics.py / analyze_reward_spread.py).
#
# Scaled down from prism_instability_experiment.yaml the same way
# prism_dpmorl_only.yaml was scaled down from prism_default.yaml: K=2 (not
# 4), 5000 updates (not 10000), mini dataset via the Makefile's lab.env
# paths (nuplan_data_root/cache_path below are full-dataset placeholders,
# overridden by the Makefile target the same way prism_dpmorl_only.yaml's
# are -- see Makefile).
#
# Keeps the SAME reduced-risk ablation toggles from that original
# investigation (outcome costs off, indicator-only cost, TTC alone, fixed
# alpha) as the starting point here too -- this is a resumption, not a
# fresh, maximally-scoped first test of the cost side.
#
# beta=1.0 is UNCALIBRATED (see prism_default.yaml's own comment: "tune
# from early-training reward_loss/cost_penalty magnitudes") -- watch the
# reward_loss/cost_penalty diagnostics in the first few hundred updates and
# be ready to revise it, don't treat 1.0 as validated.
#
# ent_coef=0.001 (with decay) is carried over from the DPMORL-only tuning,
# not re-tuned for this regime -- beta>0 introduces a second advantage
# stream (cost) into the same combined-advantage/entropy tug-of-war
# discussed at length in CHANGES.md, which could shift the balance again.
# Watch entropy the same way as before; this is a reasoned starting point,
# not a guaranteed-correct one.

# ── Experiment ───────────────────────────────────────────────────────────────
experiment_name: prism_indicator_costs_001
seed: 42

# ── nuPlan data ──────────────────────────────────────────────────────────────
nuplan_data_root: /data/nuplan/dataset
nuplan_map_root: /data/nuplan/maps
cache_path: /data/prism_cache
log_names: []

# ── PRISM MORL ───────────────────────────────────────────────────────────────
n_policies: 2
reward_dim: 4
gamma: 0.99

stage1:
  mode: preferences
  n_iters: 2000
  lr: 1.0e-3
  diversity_weight: 1.0

stage2:
  n_updates: 5000
  steps_per_update: 512
  update_epochs: 4
  minibatch_size: 64
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.001
  max_grad_norm: 0.5
  gae_lambda: 0.95
  learning_rate: 3.0e-4
  save_every: 500

# CVaR safety penalty -- beta/tau/cf_coef unchanged from
# prism_instability_experiment.yaml. Only the cost FORMULATION and alpha
# SCHEDULE change (via the toggles below), not the combined-advantage
# machinery itself.
beta: 1.0
tau: 20.0
cf_coef: 0.5
cvar_buffer_size: 500

# ── Reduced-risk ablation toggles, carried over from
#    prism_instability_experiment.yaml (the original, paused investigation)
outcome_costs_enabled: false
cost_scale: 0.5
active_indicators: [ttc]
fixed_alpha: 0.5

# alpha_start/alpha_end/n_curriculum_iters are ignored while fixed_alpha is
# set (kept here for the record / easy revert to curriculum behavior).
alpha_start: 0.20
alpha_end: 0.95
n_curriculum_iters: 5000

gpu_log_interval_s: 20.0

# ── Observation / action space ───────────────────────────────────────────────
bev_semantics_channels: 15
bev_semantics_height: 192
bev_semantics_width: 192
obs_num_measurements: 10
num_value_measurements: 4
action_space_dim: 2

# ── CaRL simulation config ───────────────────────────────────────────────────
simulation:
  controller_type: one_stage
  proposal_sampling:
    num_poses: 40
    interval_length: 0.1
  max_episode_steps: 150

scenario_types: null
log_splits:
  - train

# ── Hardware ─────────────────────────────────────────────────────────────────
cuda: true
device: cuda:0
num_envs: 1

# ── Logging ──────────────────────────────────────────────────────────────────
output_dir: runs/
track: false
wandb_project: prism
wandb_entity: null

# ── Evaluation ───────────────────────────────────────────────────────────────
eval_scenarios: val14
n_eval_episodes: 200
